name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-files:
    name: Verificar ficheiros críticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrutura do repo
        run: |
          CRITICAL=(
            "backend/server.js"
            "backend/capInamService.js"
            "backend/ttlcache.js"
            "backend/package.json"
            "frontend/index.html"
            "frontend/src/App.jsx"
            "frontend/src/main.jsx"
            "frontend/src/components/Skeleton.jsx"
            "frontend/public/manifest.webmanifest"
            "frontend/public/sw.js"
            "frontend/public/faq.html"
            "frontend/public/privacy.html"
            "frontend/public/og-image.png"
            "frontend/public/favicon.png"
            "frontend/vite.config.js"
            "deploy/wordpress-iframe-snippet.html"
            "docs/CAP-INAM-BRIEFING.md"
            "package.json"
            "Procfile"
            ".github/workflows/keep-alive.yml"
            ".github/workflows/maintenance.yml"
          )
          MISSING=()
          for f in "${CRITICAL[@]}"; do
            if [ ! -f "$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "OK todos os ${#CRITICAL[@]} ficheiros"
          else
            echo "Faltam ${#MISSING[@]} ficheiros:"
            printf ' - %s\n' "${MISSING[@]}"
            exit 1
          fi
