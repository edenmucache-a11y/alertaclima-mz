name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backend-install:
    name: Backend · install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Verificar módulos
        working-directory: backend
        run: |
          node -e "
            try {
              require('./emailService');
              require('./riskClassifier');
              require('./capInamService');
              require('./ttlcache');
              console.log('OK modulos');
            } catch (e) {
              console.error('Erro:', e.message);
              process.exit(1);
            }
          "
  frontend-build:
    name: Frontend · Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: 'true'
      - name: Verificar artefatos
        run: |
          if [ -f frontend/dist/index.html ] && [ -d frontend/dist/assets ]; then
            SIZE=$(du -sh frontend/dist | cut -f1)
            echo "OK frontend $SIZE"
          else
            echo "FAIL"
            exit 1
          fi
