name: websiteminimax
description: AlertaClima · Moçambique — alertas de ciclones e chuvas intensas no telemóvel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2
  riverpod: ^2.4.9

  # HTTP
  dio: ^5.4.3+1
  http: ^1.2.0

  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Notificações
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0

  # Armazenamento local (modo offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Geolocalização
  geolocator: ^11.0.0
  permission_handler: ^11.2.0

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
