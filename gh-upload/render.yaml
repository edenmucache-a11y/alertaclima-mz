services:
  - type: web
    name: alerta-clima-mz
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://www.amosa.org.mz,https://amosa.org.mz,https://alerta-clima-mz.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://alerta-clima-mz.onrender.com
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: POLLING_INTERVAL_MIN
        value: 15
      - key: MONITORED_LOCATIONS
        value: Maputo,Beira,Nampula,Quelimane,Tete,Xai-Xai,Chimoio,Lichinga,Pemba,Inhambane
      - key: RAIN_THRESHOLD_MM
        value: 50
      - key: RAIN_THRESHOLD_RED
        value: 100
      - key: WIND_THRESHOLD_KMH
        value: 60
      - key: WIND_THRESHOLD_RED
        value: 118
